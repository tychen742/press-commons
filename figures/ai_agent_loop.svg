<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="t d">
<title id="t">The agent loop: how the parts of an AI system fit together</title>
<desc id="d">Four zones: User, Agent, Context, and Tools and Data. 1, the user sends a request to the agent program. 2, the agent program loads context: instructions, skills, and memory. 3, the agent program sends the prompt to the model. 4, the model replies with a tool call or an answer. 5, the agent program runs the tool: a function, an MCP server, or retrieval. 6, the result returns to the agent program, and steps 3 to 6 repeat. 7, the agent program returns the answer to the user. Dashes move along each arrow in the direction the data travels.</desc>
<style>
  .flow { fill: none; stroke: #386a87; stroke-width: 1.5; stroke-dasharray: 6 5; animation: flow 0.9s linear infinite; }
  .reply { stroke: #536170; }
  @keyframes flow { to { stroke-dashoffset: -11; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  text { font-family: Helvetica, Arial, sans-serif; fill: #24334a; }
  .zone-label { font-size: 11px; fill: #536170; font-weight: bold; letter-spacing: 0.04em; }
  .node { font-size: 13px; text-anchor: middle; }
  .sub { font-size: 11px; fill: #536170; text-anchor: middle; }
  .edge { font-size: 11px; fill: #536170; text-anchor: middle; }
  .badge circle { fill: #a67c00; }
  .badge text { font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#386a87"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536170"/></marker>
</defs>
<rect width="720" height="332" rx="6" fill="#ffffff"/>

<!-- Zones (group role) -->
<g fill="#f6f8fa" stroke="#9aa9b8" stroke-width="1">
  <rect x="10" y="16" width="120" height="300" rx="8"/>
  <rect x="170" y="16" width="300" height="196" rx="8"/>
  <rect x="170" y="232" width="300" height="84" rx="8"/>
  <rect x="510" y="16" width="200" height="300" rx="8"/>
</g>
<text class="zone-label" x="22" y="34">USER</text>
<text class="zone-label" x="182" y="34">AGENT</text>
<text class="zone-label" x="182" y="250">CONTEXT</text>
<text class="zone-label" x="522" y="34">TOOLS AND DATA</text>

<!-- Nodes (default role; the model in the highlight role) -->
<g stroke-width="1.2">
  <rect x="25" y="130" width="90" height="56" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="250" y="44" width="140" height="50" rx="6" fill="#fdf3d8" stroke="#a67c00"/>
  <rect x="250" y="130" width="140" height="56" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="182" y="262" width="88" height="40" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="280" y="262" width="80" height="40" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="370" y="262" width="88" height="40" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="528" y="56" width="164" height="50" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="528" y="134" width="164" height="50" rx="6" fill="#eef3f7" stroke="#386a87"/>
  <rect x="528" y="212" width="164" height="50" rx="6" fill="#eef3f7" stroke="#386a87"/>
</g>
<text class="node" x="70" y="155">User</text><text class="sub" x="70" y="172">person or app</text>
<text class="node" x="320" y="66">Model</text><text class="sub" x="320" y="83">LLM</text>
<text class="node" x="320" y="155">Agent program</text><text class="sub" x="320" y="172">runs the loop</text>
<text class="node" x="226" y="287">Instructions</text>
<text class="node" x="320" y="287">Skills</text>
<text class="node" x="414" y="287">Memory</text>
<text class="node" x="610" y="78">Functions</text><text class="sub" x="610" y="95">code and APIs</text>
<text class="node" x="610" y="156">MCP servers</text><text class="sub" x="610" y="173">apps, files, databases</text>
<text class="node" x="610" y="234">Retrieval</text><text class="sub" x="610" y="251">search your documents</text>

<!-- Bracket: the three kinds of tools share one connection -->
<path d="M520 66V252" fill="none" stroke="#9aa9b8" stroke-width="1.5"/>

<!-- Animated connectors: path direction is the direction of travel -->
<path class="flow" d="M115 147H248" marker-end="url(#a)"/>
<path class="flow" d="M320 232V188" marker-end="url(#a)"/>
<path class="flow" d="M290 130V96" marker-end="url(#a)"/>
<path class="flow reply" d="M350 94V128" marker-end="url(#r)"/>
<path class="flow" d="M390 147H518" marker-end="url(#a)"/>
<path class="flow reply" d="M520 171H392" marker-end="url(#r)"/>
<path class="flow reply" d="M250 171H117" marker-end="url(#r)"/>

<text class="edge" x="200" y="140">request</text>
<text class="edge" x="200" y="187">answer</text>
<text class="edge" x="368" y="226">load context</text>
<text class="edge" x="254" y="116">prompt</text>
<text class="edge" x="416" y="116">tool call or answer</text>
<text class="edge" x="466" y="140">run tool</text>
<text class="edge" x="444" y="187">result</text>

<!-- Numbered steps -->
<g class="badge"><circle cx="150" cy="147" r="9"/><text x="150" y="151">1</text></g>
<g class="badge"><circle cx="320" cy="222" r="9"/><text x="320" y="226">2</text></g>
<g class="badge"><circle cx="290" cy="112" r="9"/><text x="290" y="116">3</text></g>
<g class="badge"><circle cx="350" cy="112" r="9"/><text x="350" y="116">4</text></g>
<g class="badge"><circle cx="418" cy="147" r="9"/><text x="418" y="151">5</text></g>
<g class="badge"><circle cx="490" cy="171" r="9"/><text x="490" y="175">6</text></g>
<g class="badge"><circle cx="150" cy="171" r="9"/><text x="150" y="175">7</text></g>
</svg>
