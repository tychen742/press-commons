title: ThinkPress Commons
author: ThinkPress
logo: _static/logo.svg
copyright: "2026"
only_build_toc_files: true
execute:
  execute_notebooks: "off"
html:
  favicon: _static/favicon.svg
  use_repository_button: false
  home_page_in_navbar: false
parse:
  myst_enable_extensions: [colon_fence, deflist, linkify]
sphinx:
  config:
    html_theme_options:
      logo:
        image_light: _static/logo.svg
        image_dark: _static/logo_dark.svg
    html_baseurl: https://commons.thinkpress.org/
    html_static_path: ["_static"]
    html_css_files:
      - https://commons.thinkpress.org/static/thinkpress/auth.css
      - custom.css
    html_js_files:
      - https://commons.thinkpress.org/static/thinkpress/auth.js
      - commons.js
